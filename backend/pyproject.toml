[project]
name = "viasel-backend"
version = "0.1.0"
description = "Viasel backend — equipment lifecycle record of truth"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[tool.ruff]
line-length = 100
extend-exclude = ["database/migrations", ".venv"]

[tool.ruff.lint.per-file-ignores]
"app/models.py" = ["RUF012"]  # SQLAlchemy __table_args__ dict is idiomatic

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["database/migrations", "\\.venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
